name: 构建玩客云 ImageBuilder 和 ImmortalWrt SDK

on:
  schedule:
    # 每月 1 日 UTC 02:00（北京时间 10:00）自动构建。
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "全量插件推荐自托管 Linux x64；普通 Actions 可能超出磁盘或 6 小时限制"
        type: choice
        options:
          - ubuntu-24.04
          - self-hosted
        default: ubuntu-24.04

permissions:
  contents: write

env:
  TZ: Etc/UTC
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_TAG: v25.12.2
  REPO_COMMIT: 4fc16f2985a358bd43bb522e43f05395fcbd6ed5

jobs:
  build-tools:
    runs-on: ${{ (inputs.runner || vars.TOOLS_RUNNER) == 'self-hosted' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (inputs.runner || vars.TOOLS_RUNNER) == 'self-hosted' && 1440 || 360 }}

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      - name: 清理 GitHub 托管 runner 的磁盘空间
        if: runner.environment == 'github-hosted'
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/share/miniconda \
            /opt/microsoft /usr/local/share/powershell /usr/local/lib/node_modules || true

      - name: 安装编译依赖并创建独立构建目录
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget ccache device-tree-compiler libelf-dev dosfstools mtools zstd
          if [ "${{ runner.environment }}" = github-hosted ]; then
            sudo apt-get -y autoremove --purge
            sudo apt-get clean
          fi
          BUILD_ROOT="${RUNNER_TEMP}/onecloud-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$BUILD_ROOT"
          echo "BUILD_ROOT=$BUILD_ROOT" >> "$GITHUB_ENV"
          df -hT "$BUILD_ROOT"
          free -h
          available_kb=$(df -Pk "$BUILD_ROOT" | awk 'NR==2 {print $4}')
          if [ "$available_kb" -lt 157286400 ]; then
            echo "::warning::全量 feeds 编译建议至少 150 GiB 可用磁盘，空间不足可能导致构建失败"
          fi

      - name: 克隆 ImmortalWrt ${{ env.REPO_TAG }} 源码
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          git clone --depth=1 --single-branch --branch "${REPO_TAG}" "${REPO_URL}" openwrt
          [ "$(git -C openwrt rev-parse HEAD)" = "${REPO_COMMIT}" ] || {
            echo "::error::发布标签对应的提交与预期不一致"; exit 1; }
          ln -sfn "${BUILD_ROOT}/openwrt" "${GITHUB_WORKSPACE}/openwrt"
          echo "OPENWRT_SHA=$(git -C openwrt rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OPENWRT_VERSION=${REPO_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=tools-immortalwrt-25.12.2-$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: 缓存编译缓存和已下载源码
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_ROOT }}/openwrt/.ccache
            ${{ env.BUILD_ROOT }}/openwrt/dl
          key: onecloud-tools-${{ env.REPO_TAG }}-${{ hashFiles('config/onecloud-tools.config') }}
          restore-keys: |
            onecloud-tools-${{ env.REPO_TAG }}-

      - name: 注入玩客云设备支持
        run: |
          # 上游没有此 S805 目标，必须保留设备树、内核补丁和镜像规则。
          cp -a target openwrt/
          chmod +x openwrt/target/linux/amlogic/image/*.sh \
            openwrt/target/linux/amlogic/base-files/etc/board.d/* \
            openwrt/target/linux/amlogic/base-files/etc/uci-defaults/*

      - name: 更新并安装软件包源
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 发布标签固定了 feeds 提交，不允许切换到最新分支或其他版本。
          while read -r type name source rest; do
            case "$type" in
              src-git*)
                expected="${source##*^}"
                [ "$expected" != "$source" ] && \
                  [ "$(git -C "feeds/$name" rev-parse HEAD)" = "$expected" ] || {
                    echo "::error::软件包源 $name 未匹配 ImmortalWrt 25.12.2 固定提交"; exit 1; }
                ;;
            esac
          done < feeds.conf.default

      - name: 生成全量兼容插件构建配置
        run: |
          cd openwrt
          cp "${GITHUB_WORKSPACE}/config/onecloud-tools.config" .config
          make defconfig
          for sym in \
            CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y \
            CONFIG_TARGET_ROOTFS_EXT4FS=y \
            CONFIG_IB=y CONFIG_IB_STANDALONE=y CONFIG_SDK=y \
            CONFIG_ALL=y CONFIG_ALL_KMODS=y CONFIG_ALL_NONSHARED=y; do
            grep -qx "$sym" .config || {
              echo "::error::必要配置缺失：$sym"; exit 1; }
          done
          grep -qx '# CONFIG_BROKEN is not set' .config
          selected=$(grep -Ec '^CONFIG_PACKAGE_.*=(y|m)$' .config)
          echo "已选择 $selected 个兼容软件包（默认包 y，附加包 m）"

      - name: 下载编译所需源码
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: 编译工具链、内核和配套软件包
        run: |
          cd openwrt
          # 编译全部 Kconfig 可选的兼容插件，任一编译失败均终止发布，不忽略错误。
          # 不运行默认 world 目标，避免直接生成最终固件镜像。
          build_stage() {
            make -j"$(nproc)" "$@" || make -j1 V=s "$@"
          }
          # 上游 liblzo 的并行依赖未完整覆盖 ccache，先安装编译启动器。
          build_stage tools/ccache/compile
          build_stage tools/install
          build_stage toolchain/install
          build_stage target/compile
          build_stage package/compile
          build_stage package/install
          build_stage package/index

      - name: 生成独立 ImageBuilder 和 ImmortalWrt SDK
        run: |
          cd openwrt
          # target/install 会准备最终内核，并按 CONFIG_IB / CONFIG_SDK 打包工具。
          # 仅在本次 make 调用中清空镜像文件系统列表，跳过所有根文件系统镜像。
          # 不修改 .config，确保 ImageBuilder 仍保留 ext4 镜像生成能力。
          make -j"$(nproc)" target/install TARGET_FILESYSTEMS= \
            CONFIG_TARGET_ROOTFS_TARGZ= CONFIG_TARGET_ROOTFS_CPIOGZ= || \
            make -j1 V=s target/install TARGET_FILESYSTEMS= \
              CONFIG_TARGET_ROOTFS_TARGZ= CONFIG_TARGET_ROOTFS_CPIOGZ=
          ls -lh bin/targets/amlogic/meson8b/
          df -hT

      - name: 验证工具包完整性且未生成固件镜像
        run: |
          cd openwrt/bin/targets/amlogic/meson8b
          shopt -s nullglob
          builders=( ./*-imagebuilder-*.tar.zst )
          sdks=( ./*-sdk-*.tar.zst )
          firmware=( ./*-sysupgrade.img* ./*-emmc.burn.img* )
          [ "${#builders[@]}" -eq 1 ] && [ "${#sdks[@]}" -eq 1 ] || {
            echo "::error::ImageBuilder 或 SDK 产物缺失或数量异常"; exit 1; }
          [ "${#firmware[@]}" -eq 0 ] || {
            echo "::error::工具流程不应生成固件镜像"; exit 1; }
          zstd -t "${builders[@]}" "${sdks[@]}"
          # 对照所有已编译包，确认独立 ImageBuilder 中没有漏装本地插件。
          find ../../.. -type f \( -name '*.apk' -o -name '*.ipk' \) -printf '%f\n' \
            | LC_ALL=C sort -u > /tmp/built-packages
          tar --zstd -tf "${builders[0]}" \
            | awk -F/ '/\/packages\/[^/]+\.(apk|ipk)$/ {print $NF}' \
            | LC_ALL=C sort -u > /tmp/bundled-packages
          [ -s /tmp/built-packages ] || { echo "::error::未生成软件包仓库"; exit 1; }
          LC_ALL=C comm -23 /tmp/built-packages /tmp/bundled-packages > /tmp/missing-packages
          if [ -s /tmp/missing-packages ]; then
            echo "::error::ImageBuilder 缺少以下已编译插件"
            head -50 /tmp/missing-packages
            exit 1
          fi
          echo "ImageBuilder 已包含全部 $(wc -l < /tmp/built-packages) 个已编译包"

      - name: 仅收集 ImageBuilder 和 SDK
        run: |
          mkdir -p /tmp/tools
          cp openwrt/bin/targets/amlogic/meson8b/*-imagebuilder-*.tar.zst /tmp/tools/
          cp openwrt/bin/targets/amlogic/meson8b/*-sdk-*.tar.zst /tmp/tools/

      - name: 上传 ImageBuilder 和 SDK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-build-tools-${{ env.RELEASE_TAG }}
          path: /tmp/tools
          compression-level: 0
          if-no-files-found: error

      - name: 检查 GitHub Release 附件大小限制
        id: release-size
        run: |
          allowed=true
          for archive in /tmp/tools/*.tar.zst; do
            if [ "$(stat -c %s "$archive")" -ge 2147483648 ]; then
              echo "::warning::全量工具包超过 Release 单附件 2 GiB 限制，请从 Actions Artifacts 下载"
              allowed=false
            fi
          done
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: 发布独立构建工具
        if: steps.release-size.outputs.allowed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 玩客云 ImageBuilder 和 ImmortalWrt SDK ${{ env.RELEASE_TAG }}
          files: /tmp/tools/*
          make_latest: false
          body: |
            适用于玩客云（Amlogic S805 / meson8b）的 ImmortalWrt `${{ env.OPENWRT_VERSION }}` 构建工具，源码提交：`${{ env.OPENWRT_SHA }}`。

            本次发布仅包含以下两个工具包，不包含固件、自定义文件或额外附件。

            | 产物 | 用途 |
            | --- | --- |
            | `*-imagebuilder-*.tar.zst` | 独立 ImageBuilder，包含全部已编译的兼容软件包及内核模块 |
            | `*-sdk-*.tar.zst` | ImmortalWrt SDK，编译此目标的软件包 |

            在 Linux x86_64 上使用，ImageBuilder 设备配置为 `PROFILE=thunder-onecloud`。
            使用 ImmortalWrt 25.12.2 标签固定的 feeds，启用 ALL、ALL_KMODS 和 ALL_NONSHARED。
            附加插件编译后收录到本地仓库，不会全部预装；使用 `PACKAGES=` 按需选择。
            仅包含 Kconfig 对此 ARM 32 位目标可选的软件包，排除 BROKEN 和架构不兼容的包；编译失败不会静默跳过。
            不注入自定义文件，不修改默认网络和密码。全量配置与定制固件的内核 ABI 可能不同，勿直接混用内核模块。
