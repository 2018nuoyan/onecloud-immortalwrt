name: Build ImmortalWrt OneCloud

on:
  schedule:
    # 02:00 UTC on the 1st of every month
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      lan_ip:
        description: "Default LAN IP"
        required: false
        default: "10.10.10.1"
      use_ccache:
        description: "Use ccache"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  TZ: Etc/UTC
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_TAG: v25.12.2
  REPO_COMMIT: 4fc16f2985a358bd43bb522e43f05395fcbd6ed5
  LAN_IP: ${{ inputs.lan_ip || '10.10.10.1' }}
  USE_CCACHE: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.use_ccache && 'true' || 'false') }}
  AMLIMG_VERSION: v0.3.1
  UBOOT_URL: https://github.com/hzyitc/u-boot-onecloud/releases/download/build-20221028-0940/eMMC.burn.img

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space and install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/share/miniconda \
            /opt/microsoft /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo apt-get -y update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget ccache device-tree-compiler libelf-dev dosfstools mtools \
            android-sdk-libsparse-utils qemu-utils
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo timedatectl set-timezone "${TZ}"
          sudo mkdir -p /workdir
          sudo chown "$USER:$USER" /workdir
          df -hT

      - name: Clone ImmortalWrt ${{ env.REPO_TAG }}
        working-directory: /workdir
        run: |
          git clone --depth=1 --single-branch --branch "${REPO_TAG}" "${REPO_URL}" openwrt
          [ "$(git -C openwrt rev-parse HEAD)" = "${REPO_COMMIT}" ] || {
            echo "::error::release tag does not match the expected commit"; exit 1; }
          ln -sfn /workdir/openwrt "${GITHUB_WORKSPACE}/openwrt"
          echo "OPENWRT_SHA=$(git -C openwrt rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OPENWRT_VERSION=${REPO_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=immortalwrt-25.12.2-$(date +%Y.%m.%d)" >> "$GITHUB_ENV"

      - name: Cache ccache and downloads
        uses: actions/cache@v4
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/dl
          key: onecloud-immortalwrt-${{ env.REPO_TAG }}-${{ hashFiles('config/onecloud.config') }}
          restore-keys: |
            onecloud-immortalwrt-${{ env.REPO_TAG }}-

      - name: Inject target and custom files
        run: |
          cp -a target openwrt/
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          chmod +x scripts/*.sh \
            openwrt/files/usr/sbin/onecloud-install-emmc \
            openwrt/files/etc/uci-defaults/* \
            openwrt/target/linux/amlogic/image/*.sh \
            openwrt/target/linux/amlogic/base-files/etc/board.d/* \
            openwrt/target/linux/amlogic/base-files/etc/uci-defaults/*
          cd openwrt
          "${GITHUB_WORKSPACE}/scripts/diy-part1.sh"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply customisations and generate .config
        run: |
          cd openwrt
          cp "${GITHUB_WORKSPACE}/config/onecloud.config" .config
          "${GITHUB_WORKSPACE}/scripts/diy-part2.sh" "${LAN_IP}" "${USE_CCACHE}"
          ./scripts/feeds install -a
          make defconfig

      - name: Verify every requested package survived defconfig
        run: |
          cd openwrt
          "${GITHUB_WORKSPACE}/scripts/verify-config.sh"

      - name: Download sources
        run: |
          cd openwrt
          make download -j8
          # Drop failed downloads. Only top-level files: dl/ also holds the
          # extracted go-mod-cache tree, and plenty of legitimate .go files in
          # there are under 1 KiB. Pruning those corrupts the module cache and
          # breaks every Go package on the next cached run.
          find dl -maxdepth 1 -type f -size -1024c -print -delete

      - name: Compile
        id: compile
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          df -hT
          ls -lh bin/targets/amlogic/meson8b/

      - name: Pack Amlogic USB Burning Tool image
        run: |
          set -eo pipefail
          cd openwrt/bin/targets/amlogic/meson8b
          gz=$(ls ./*-sysupgrade.img.gz | head -1)
          prefix="${gz%-sysupgrade.img.gz}"

          # append-metadata leaves fwtool data after the gzip stream; gzip
          # reports that as trailing garbage, which is expected here.
          gzip -dc "$gz" > disk.img 2>/dev/null || true
          [ -s disk.img ] || { echo "failed to decompress $gz"; exit 1; }

          curl -fsSL -o AmlImg \
            "https://github.com/hzyitc/AmlImg/releases/download/${AMLIMG_VERSION}/AmlImg_${AMLIMG_VERSION}_linux_amd64"
          chmod +x AmlImg
          curl -fsSL -o uboot.burn.img "${UBOOT_URL}"
          ./AmlImg unpack uboot.burn.img burn/

          loop=$(sudo losetup --find --show --partscan disk.img)
          sudo img2simg "${loop}p1" burn/boot.simg
          sudo img2simg "${loop}p2" burn/rootfs.simg
          sudo losetup -d "$loop"
          sudo chown "$USER:$USER" burn/boot.simg burn/rootfs.simg

          printf 'PARTITION:boot:sparse:boot.simg\nPARTITION:rootfs:sparse:rootfs.simg\n' >> burn/commands.txt
          ./AmlImg pack "${prefix}-emmc.burn.img" burn/
          xz -9 --threads=0 "${prefix}-emmc.burn.img"

          rm -rf burn AmlImg uboot.burn.img disk.img
          ls -lh

      - name: Collect release files
        run: |
          mkdir -p /tmp/fw
          cd openwrt/bin/targets/amlogic/meson8b
          cp ./*-sysupgrade.img.gz ./*-emmc.burn.img.xz /tmp/fw/
          cp ./*-imagebuilder-*.tar.zst ./*-sdk-*.tar.zst /tmp/fw/
          cp ../../../../.config /tmp/fw/build.config
          cp ../../../../feeds.conf.default /tmp/fw/feeds.conf.default
          cp "${GITHUB_WORKSPACE}/config/onecloud.config" /tmp/fw/onecloud.config
          tar -czf /tmp/fw/onecloud-files.tar.gz -C "${GITHUB_WORKSPACE}" files
          printf 'source=%s\ntag=%s\ncommit=%s\n' \
            "${REPO_URL}" "${OPENWRT_VERSION}" \
            "$(git -C ../../../.. rev-parse HEAD)" > /tmp/fw/source-version.txt
          cd /tmp/fw && sha256sum ./* > sha256sums && ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-immortalwrt-${{ env.RELEASE_TAG }}
          path: /tmp/fw
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OneCloud ImmortalWrt ${{ env.RELEASE_TAG }}
          files: /tmp/fw/*
          make_latest: true
          body: |
            ImmortalWrt `${{ env.OPENWRT_VERSION }}` (`${{ env.OPENWRT_SHA }}`) for Thunder OneCloud (Amlogic S805).

            Matching standalone ImageBuilder and SDK are included. Extract `onecloud-files.tar.gz` and pass its `files/` directory to ImageBuilder with `FILES=` to retain device defaults.

            | | |
            | --- | --- |
            | LAN | `${{ env.LAN_IP }}` |
            | login | `root` / `password` |
            | timezone | `Asia/Tokyo` |

            **First flash / recovery** — `*-emmc.burn.img.xz`, unpack and write with the Amlogic USB Burning Tool.

            **Updating** — `*-sysupgrade.img.gz` through LuCI → System → Backup / Flash Firmware, or `sysupgrade`. Only the boot and root partitions are written; u-boot is left alone.

      - name: Prune old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        continue-on-error: true
        with:
          keep_latest: 6
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
