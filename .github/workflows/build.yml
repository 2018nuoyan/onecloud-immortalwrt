name: 构建玩客云 ImmortalWrt 固件

on:
  schedule:
    # 每月 1 日 UTC 02:00（北京时间 10:00）自动构建
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      lan_ip:
        description: "默认 LAN IP 地址"
        required: false
        default: "10.10.10.1"
      use_ccache:
        description: "启用 ccache 编译缓存"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  TZ: Etc/UTC
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_TAG: v25.12.2
  REPO_COMMIT: 4fc16f2985a358bd43bb522e43f05395fcbd6ed5
  LAN_IP: ${{ inputs.lan_ip || '10.10.10.1' }}
  USE_CCACHE: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.use_ccache && 'true' || 'false') }}
  AMLIMG_VERSION: v0.3.1
  UBOOT_URL: https://github.com/hzyitc/u-boot-onecloud/releases/download/build-20221028-0940/eMMC.burn.img

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      - name: 清理磁盘空间并安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/share/miniconda \
            /opt/microsoft /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo apt-get -y update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget ccache device-tree-compiler libelf-dev dosfstools mtools \
            android-sdk-libsparse-utils qemu-utils
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo timedatectl set-timezone "${TZ}"
          sudo mkdir -p /workdir
          sudo chown "$USER:$USER" /workdir
          df -hT

      - name: 克隆 ImmortalWrt ${{ env.REPO_TAG }} 源码
        working-directory: /workdir
        run: |
          git clone --depth=1 --single-branch --branch "${REPO_TAG}" "${REPO_URL}" openwrt
          [ "$(git -C openwrt rev-parse HEAD)" = "${REPO_COMMIT}" ] || {
            echo "::error::发布标签对应的提交与预期不一致"; exit 1; }
          ln -sfn /workdir/openwrt "${GITHUB_WORKSPACE}/openwrt"
          echo "OPENWRT_SHA=$(git -C openwrt rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OPENWRT_VERSION=${REPO_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=immortalwrt-25.12.2-$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: 缓存编译缓存和已下载源码
        uses: actions/cache@v4
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/dl
          key: onecloud-immortalwrt-${{ env.REPO_TAG }}-${{ hashFiles('config/onecloud.config') }}
          restore-keys: |
            onecloud-immortalwrt-${{ env.REPO_TAG }}-

      - name: 注入设备支持和自定义文件
        run: |
          cp -a target openwrt/
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          chmod +x scripts/*.sh \
            openwrt/files/usr/sbin/onecloud-install-emmc \
            openwrt/files/etc/uci-defaults/* \
            openwrt/target/linux/amlogic/image/*.sh \
            openwrt/target/linux/amlogic/base-files/etc/board.d/* \
            openwrt/target/linux/amlogic/base-files/etc/uci-defaults/*
          cd openwrt
          "${GITHUB_WORKSPACE}/scripts/diy-part1.sh"

      - name: 更新并安装软件包源
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 应用自定义设置并生成编译配置
        run: |
          cd openwrt
          cp "${GITHUB_WORKSPACE}/config/onecloud.config" .config
          "${GITHUB_WORKSPACE}/scripts/diy-part2.sh" "${LAN_IP}" "${USE_CCACHE}"
          ./scripts/feeds install -a
          # 固件流程禁用工具包打包，保留相同的软件包和内核配置。
          sed -i '/^CONFIG_IB=/d; /^CONFIG_IB_STANDALONE=/d; /^CONFIG_SDK=/d' .config
          printf '# CONFIG_IB is not set\n# CONFIG_IB_STANDALONE is not set\n# CONFIG_SDK is not set\n' >> .config
          make defconfig

      - name: 检查软件包、设备和纯固件构建配置
        run: |
          cd openwrt
          "${GITHUB_WORKSPACE}/scripts/verify-config.sh" firmware

      - name: 下载编译所需源码
        run: |
          cd openwrt
          make download -j8
          # 清理不足 1 KiB 的顶层下载文件，不递归处理 dl/ 子目录。
          # dl/ 还保存解压后的 go-mod-cache，其中许多正常 .go 文件不足 1 KiB。
          # 递归删除会损坏 Go 模块缓存，导致后续使用缓存编译 Go 软件包失败。
          find dl -maxdepth 1 -type f -size -1024c -print -delete

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          df -hT
          ls -lh bin/targets/amlogic/meson8b/

      - name: 打包晶晨 USB Burning Tool 线刷镜像
        run: |
          set -eo pipefail
          cd openwrt/bin/targets/amlogic/meson8b
          gz=$(ls ./*-sysupgrade.img.gz | head -1)
          prefix="${gz%-sysupgrade.img.gz}"

          # append-metadata 会在 gzip 数据流尾部附加 fwtool 元数据。
          # gzip 因此可能提示尾部存在额外数据，这是此处的预期情况。
          gzip -dc "$gz" > disk.img 2>/dev/null || true
          [ -s disk.img ] || { echo "解压镜像失败：$gz"; exit 1; }

          curl -fsSL -o AmlImg \
            "https://github.com/hzyitc/AmlImg/releases/download/${AMLIMG_VERSION}/AmlImg_${AMLIMG_VERSION}_linux_amd64"
          chmod +x AmlImg
          curl -fsSL -o uboot.burn.img "${UBOOT_URL}"
          ./AmlImg unpack uboot.burn.img burn/

          loop=$(sudo losetup --find --show --partscan disk.img)
          sudo img2simg "${loop}p1" burn/boot.simg
          sudo img2simg "${loop}p2" burn/rootfs.simg
          sudo losetup -d "$loop"
          sudo chown "$USER:$USER" burn/boot.simg burn/rootfs.simg

          printf 'PARTITION:boot:sparse:boot.simg\nPARTITION:rootfs:sparse:rootfs.simg\n' >> burn/commands.txt
          ./AmlImg pack "${prefix}-emmc.burn.img" burn/
          xz -9 --threads=0 "${prefix}-emmc.burn.img"

          rm -rf burn AmlImg uboot.burn.img disk.img
          ls -lh

      - name: 收集固件和校验文件
        run: |
          mkdir -p /tmp/fw
          cd openwrt/bin/targets/amlogic/meson8b
          cp ./*-sysupgrade.img.gz ./*-emmc.burn.img.xz /tmp/fw/
          cp ../../../../.config /tmp/fw/build.config
          cp ../../../../feeds.conf.default /tmp/fw/feeds.conf.default
          cp "${GITHUB_WORKSPACE}/config/onecloud.config" /tmp/fw/onecloud.config
          printf 'source=%s\ntag=%s\ncommit=%s\n' \
            "${REPO_URL}" "${OPENWRT_VERSION}" \
            "$(git -C ../../../.. rev-parse HEAD)" > /tmp/fw/source-version.txt
          cd /tmp/fw && sha256sum ./* > sha256sums && ls -lh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-immortalwrt-${{ env.RELEASE_TAG }}
          path: /tmp/fw
          if-no-files-found: error

      - name: 发布固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 玩客云 ImmortalWrt ${{ env.RELEASE_TAG }}
          files: /tmp/fw/*
          make_latest: true
          body: |
            适用于玩客云（Thunder OneCloud，Amlogic S805）的 ImmortalWrt `${{ env.OPENWRT_VERSION }}`，源码提交：`${{ env.OPENWRT_SHA }}`。

            本次发布仅包含固件。ImageBuilder 和 ImmortalWrt SDK 请使用独立的构建工具工作流生成。

            | 产物 | 用途 |
            | --- | --- |
            | `*-sysupgrade.img.gz` | 系统升级镜像 |
            | `*-emmc.burn.img.xz` | 首次刷机或救砖的线刷镜像 |
            | `sha256sums` | 下载文件的 SHA-256 校验值 |

            | 默认设置 | 值 |
            | --- | --- |
            | LAN 地址 | `${{ env.LAN_IP }}` |
            | 用户名 / 密码 | `root` / `password`（请及时修改） |
            | 时区 | `Asia/Tokyo` |

            **首次刷机 / 救砖**：解压 `*-emmc.burn.img.xz`，使用晶晨 USB Burning Tool 写入。

            **系统升级**：在 LuCI → 系统 → 备份/升级中上传 `*-sysupgrade.img.gz`，或使用 `sysupgrade` 命令。仅写入引导分区和根分区，不改动 u-boot。

      - name: 清理旧固件版本（保留最近 6 次固件发布）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 仅清理固件发布，不删除独立工具流程的 Release。
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("immortalwrt-25.12.2-"))] | sort_by(.createdAt) | reverse | .[6:][] | .tagName' \
            > /tmp/old-firmware-tags
          while IFS= read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < /tmp/old-firmware-tags
